# pnpm settings. pnpm 11 reads these only from this file: it ignores the
# `pnpm` field of package.json without a warning (pnpm/pnpm#10086), which is
# where the overrides lived until the pnpm 11 migration (#409).
# Guarded by scripts/src/pnpm-config.test.ts.

# minimumReleaseAge is left at pnpm 11's default of 1440 minutes (one day):
# a version is not resolved until it has been public for a day. ADR-065
# records why, and the escape hatch for an urgent fix — minimumReleaseAgeExclude,
# which `pnpm audit --fix` fills in for you. Annotate each entry with
# `# until <ISO 8601 UTC>` (publish time + 1 day); pnpm-config.test.ts fails
# once that passes. Do not set minimumReleaseAge to 0.

# pnpm 11 makes an unlisted dependency build script an install error
# (strictDepBuilds). pnpm 10 silently skipped esbuild's postinstall and every
# build worked, because esbuild ships its binary as a platform optional
# dependency (@esbuild/<platform>). Denying it keeps that behaviour exactly and
# runs no dependency script at install time.
allowBuilds:
  esbuild: false

overrides:
  qs: "^6.16.0"
  fast-uri: "^3.1.6" # caret pins the 3.x major; harmless until ajv declares fast-uri ^4 (#399)
  browserslist: ">=4.28.7"
  "devalue@<5.9.2": "^5.9.2" # GHSA-9rgm-9g3h-6x36 via astro/@astrojs/preact (#423); lapses once they require ^5.9.2
  sharp: "^0.35.4"
  "smol-toml@<1.7.1": "^1.7.1" # GHSA-7w5x-hrqm-74c2; markdownlint-cli2 <=0.23.2 pinned 1.7.0 exactly (#423)
  "tmp@<0.2.6": "^0.2.6"
  "uuid@^8": "^11.1.1"
  "puppeteer-core>@puppeteer/browsers": "^3.2.1" # severed the extract-zip chain under @lhci/cli (#353)
