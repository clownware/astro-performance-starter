version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "master"
    rebase-strategy: "auto"
    # One PR for all action bumps: each separate PR costs a full CI +
    # Lighthouse run plus a master-push CI run when merged.
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "master"
    registries: []
    rebase-strategy: "auto"
    # @astrojs/check pins typescript to ^5 || ^6; the TS 7 (Go compiler) major
    # crashes `astro check`. Lift this once the Astro language server supports it.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Dev-only tooling lands as one weekly PR; production dependencies stay
    # individual so a runtime bump is reviewed on its own and one failing
    # bump doesn't block the rest.
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]
