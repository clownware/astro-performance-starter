name: Lighthouse CI

# Gates PRs on the documented NON-NEGOTIABLE Lighthouse floor (see
# `.claude/stack.md` and `lighthouserc.json`). The headline "95+" claim is
# verified by the manual Wave-3 pass and recorded in #246; this workflow keeps
# PRs from silently dropping below the floor, while accommodating single-run
# variance and the tracked /adr theme-init flash (#279).

on:
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      # The Astro config validates SITE_URL at load time (ADR-050); the
      # documented placeholder values would trip validate-env.ts, so we use a
      # real-looking origin matching the GitHub Pages deploy.
      SITE_URL: https://${{ github.repository_owner }}.github.io

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      # Gate on BOTH form factors. Mobile throttling routinely drops a site
      # 15-25 points below desktop, so desktop-only was a soft ratchet; the
      # demo passes mobile at Performance 0.98-1.00 (measured), so both gates
      # hold the same strict floors. The build is shared — only the ~2-min
      # Lighthouse runs are duplicated.
      - name: Run Lighthouse CI (desktop)
        run: pnpm exec lhci autorun --config=lighthouserc.json
        env:
          # lhci picks this up when present and writes a status check on the PR
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Run Lighthouse CI (mobile)
        run: pnpm exec lhci autorun --config=lighthouserc.mobile.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: |
            lighthouse-ci-reports/
            lighthouse-ci-reports-mobile/
          retention-days: 14
          if-no-files-found: ignore
