name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  security-events: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22


      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, format & type-check
        run: pnpm run quality

      - name: Validate budget overrides
        run: pnpm run budgets:validate

      - name: Validate semantic color contrast
        run: pnpm run design:validate

      - name: Build site
        run: pnpm run build

      - name: Enforce JS bundle size budget (160 KB gzipped target)
        shell: bash
        run: |
          set -e
          JS_BUNDLE_PATH="dist/_astro"
          JS_SIZE_LIMIT_BYTES=163840 # 160 KB target (gzipped)
          if [ ! -d "$JS_BUNDLE_PATH" ]; then
            echo "⚠️  JS bundle path '$JS_BUNDLE_PATH' not found. Skipping size check."
            exit 0
          fi
          if [ "$(uname)" = "Darwin" ]; then
            JS_SIZE=$(find "$JS_BUNDLE_PATH" -name "*.js" -type f -exec stat -f%z {} + | awk '{sum+=$1} END {print sum}')
          else
            JS_SIZE=$(find "$JS_BUNDLE_PATH" -name "*.js" -type f -exec stat -c%s {} + | awk '{sum+=$1} END {print sum}')
          fi
          JS_SIZE=${JS_SIZE:-0}
          echo "ℹ️  Total raw JS size: $JS_SIZE bytes"
          if [ "$JS_SIZE" -gt "$JS_SIZE_LIMIT_BYTES" ]; then
            echo "❌ JavaScript bundle size exceeds limit ($JS_SIZE_LIMIT_BYTES bytes)."
            exit 1
          fi
          echo "✅ Bundle size within limit."

      - name: Security audit (high severity)
        run: pnpm run audit:ci

      - name: Trivy SBOM scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload security results
        if: success() && (hashFiles('trivy-results.sarif') != '')
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
